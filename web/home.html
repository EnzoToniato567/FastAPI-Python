<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Início | Pizzaria</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="home">

    <header class="site-header">
        <a class="brand" href="home.html">Pizzaria</a>

        <nav aria-label="Navegação principal">
            <a href="home.html" aria-current="page">Início</a>
            <a href="clientes.html">Clientes</a>
            <a href="pizzas.html">Pizzas</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="itens.html">Itens do pedido</a>

            </a>
            <a class="summary-card" href="itens.html">
